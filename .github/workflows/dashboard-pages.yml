name: Publish dashboard
on:
  pull_request:
    branches: [gh-pages]
  push:
    branches: [gh-pages]
permissions:
  contents: read
concurrency:
  group: dashboard-pages-${{ github.event.pull_request.number || 'live' }}
  cancel-in-progress: false
jobs:
  build:
    name: Build and validate the published site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: CIAT/nbs_ruralscan
          ref: bec50bc0f9dc74b3d5ffafcf881571a8a8ec5c06
          path: producer
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /docs/dashboard_data.json
            /docs/t4_analysis*.json
      - name: Assemble public dashboard and immutable data
        run: |
          mkdir -p site/data/bec50bc0f9dc
          git archive HEAD -- index.html dashboard.html '*.css' '*.js' assets review vendor LICENSE | tar -x -C site
          cp producer/docs/dashboard_data.json producer/docs/t4_analysis*.json site/data/bec50bc0f9dc/
          mv site/dashboard.html site/legacy.html
      - name: Check out the methodology reference
        id: reference_source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: e1ccbe2065e509c9a274c92f23c457bb1d54d413
          path: reference-src
          fetch-depth: 0
          persist-credentials: false
      - name: Read the evidence operating revision
        id: reference_pins
        run: |
          revision=$(sed -nE 's/^EVIDENCE_OPERATING = "([0-9a-f]{40})"$/\1/p' reference-src/methodology-reference/build/core.py)
          test "${#revision}" -eq 40
          echo "evidence=$revision" >> "$GITHUB_OUTPUT"
      - name: Check out the pinned evidence revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: RuralScan/evidence
          ref: ${{ steps.reference_pins.outputs.evidence }}
          path: evidence-src
          persist-credentials: false
      - name: Check out the runtime source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: RuralScan/runtime
          path: runtime-src
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build the listed methodology reference
        if: steps.reference_source.outcome == 'success'
        env:
          NAMES: ${{ secrets.REFERENCE_PEOPLE }}
        run: |
          set -euo pipefail
          work=$(mktemp -d "$RUNNER_TEMP/reference.XXXXXX")
          stage=$(mktemp -d "$GITHUB_WORKSPACE/.reference.XXXXXX")
          trap 'rm -rf -- "$work" "$stage"' EXIT
          printf '%s\n' "${NAMES:-}" > "$work/people.txt"
          unset NAMES RURALSCAN_PEOPLE_OPTIONAL
          if ! awk -F '=>' '$1 ~ /[^[:space:]]/ && $1 !~ /^[[:space:]]*#/ { found=1 } END { exit !found }' "$work/people.txt"; then
            echo "::warning title=Reference not published::Set REFERENCE_PEOPLE to the names list."
            exit 1
          fi

          cd "$GITHUB_WORKSPACE/reference-src/methodology-reference"
          pin() { sed -nE "s/^${1} = \"([0-9a-f]{40})\"$/\\1/p" build/core.py; }
          # Full source and producer history are already available from checkout steps.
          git cat-file -e "$(pin SITE_REV)^{commit}"
          python3 -m venv "$work/venv"
          "$work/venv/bin/pip" install 'markdown==3.11.3' 'duckdb==1.5.3' 'pandas==2.3.1'

          export RURALSCAN_PEOPLE="$work/people.txt" RURALSCAN_EVIDENCE="$GITHUB_WORKSPACE/evidence-src"
          export RURALSCAN_RUNTIME="$GITHUB_WORKSPACE/runtime-src" RURALSCAN_CIAT="$GITHUB_WORKSPACE/producer"
          "$work/venv/bin/python" -B build/fetch_package.py
          # A failed attribution check can report excerpts of private notes.
          if ! "$work/venv/bin/python" -B build/build.py --out "$stage/reference" > "$work/checks.log" 2>&1; then
            echo "::warning title=Reference not published::Reference build or validation failed."
            exit 1
          fi
          test -s "$stage/reference/index.html"
          test ! -e "$stage/reference/NOT-FOR-PUBLICATION.txt"
          # A later source pin must also opt in before its pages can be listed.
          python3 - "$stage/reference" <<'PYTHON'
          from pathlib import Path
          import sys
          for page in Path(sys.argv[1]).rglob("*.html"):
              if '<meta name="robots" content="noindex">' in page.read_text(encoding="utf-8"):
                  raise SystemExit("Reference output is marked noindex")
          PYTHON
          test ! -e "$GITHUB_WORKSPACE/site/reference"
          mv "$stage/reference" "$GITHUB_WORKSPACE/site/reference"
      - name: Test dashboard navigation and review components
        run: |
          node --test tests/*.test.cjs
          python3 -B -m unittest discover -s tests -p 'test_*.py'
      - name: Require the consolidated evidence methods
        run: |
          test -s site/reference/ch-evidence-principles.html
          test -s site/reference/ch-compiling-evidence.html
          test -s site/reference/ch-suitability-synthesis.html
          test -s site/reference/ch-t4-legacy-compiler.html
          test -s site/reference/ch-t4-overrides.html
          test -s site/reference/data/t4-overrides.json
          test -s site/reference/override-review.js
          test -s site/reference/override-review.css
          node - <<'JS'
          const fs = require("node:fs");
          const view = require("./site/reference/override-review.js");
          const model = view.validate(JSON.parse(fs.readFileSync("site/reference/data/t4-overrides.json", "utf8")));
          if (model.records.length !== 4) throw Error("Expected four pending specialist rules");
          console.log("Four pending rules, no runtime activation");
          JS
          test -s site/reference/ch-evidence-registry.html
          test -s site/reference/ch-combining-t4-evidence.html
      - name: Build and verify pinned methodology editions
        run: python3 publish_editions.py
      - name: Check section 7 contains the version history
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import re
          page = Path('site/reference/editions.html').read_text()
          tabs = re.search(r'<nav class="tabs".*?</nav>', page, re.S)[0]
          assert re.search(r'<a href="editions.html"[^>]*aria-current="page"', tabs)
          assert 'id="changes"' in page
          assert 'id="methodology"' in page and 'id="evidence-base"' in page
          old = Path('site/reference/changes.html').read_text()
          assert 'location.replace("editions.html"' in old
          print('Version history belongs to section 7; old URLs preserve their destination.')
          PYTHON
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push'
        with:
          path: site
  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deploy
