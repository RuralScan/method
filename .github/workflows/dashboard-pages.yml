name: Publish dashboard
on:
  push:
    branches: [gh-pages]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: dashboard-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: CIAT/nbs_ruralscan
          ref: bec50bc0f9dc74b3d5ffafcf881571a8a8ec5c06
          path: producer
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /docs/dashboard_data.json
            /docs/t4_analysis*.json
      - name: Assemble public dashboard and immutable data
        run: |
          mkdir -p site/data/bec50bc0f9dc
          git archive HEAD -- index.html dashboard.html '*.css' '*.js' assets review vendor LICENSE | tar -x -C site
          cp producer/docs/dashboard_data.json producer/docs/t4_analysis*.json site/data/bec50bc0f9dc/
          mv site/dashboard.html site/legacy.html
      - name: Check out the methodology reference
        id: reference_source
        continue-on-error: true
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 8fddfa8322da7ab79fddb70a1c13425685bfdd4a
          path: reference-src
          fetch-depth: 0
          persist-credentials: false
      - name: Build the listed methodology reference
        if: steps.reference_source.outcome == 'success'
        continue-on-error: true
        env:
          NAMES: ${{ secrets.REFERENCE_PEOPLE }}
        run: |
          set -euo pipefail
          work=$(mktemp -d "$RUNNER_TEMP/reference.XXXXXX")
          stage=$(mktemp -d "$GITHUB_WORKSPACE/.reference.XXXXXX")
          trap 'rm -rf -- "$work" "$stage"' EXIT
          printf '%s\n' "${NAMES:-}" > "$work/people.txt"
          unset NAMES RURALSCAN_PEOPLE_OPTIONAL
          if ! awk -F '=>' '$1 ~ /[^[:space:]]/ && $1 !~ /^[[:space:]]*#/ { found=1 } END { exit !found }' "$work/people.txt"; then
            echo "::warning title=Reference not published::Set REFERENCE_PEOPLE to the names list."
            exit 1
          fi

          cd "$GITHUB_WORKSPACE/reference-src/methodology-reference"
          pin() { sed -nE "s/^${1} = \"([0-9a-f]{40})\"$/\\1/p" build/core.py; }
          git fetch --quiet --no-tags origin "$(pin SITE_REV)"
          git clone --quiet https://github.com/RuralScan/evidence.git "$work/evidence"
          git -C "$work/evidence" checkout --quiet --detach "$(pin EVIDENCE_OPERATING)"
          git clone --quiet --depth 1 https://github.com/RuralScan/runtime.git "$work/runtime"
          git clone --quiet --bare --single-branch --branch main --no-tags https://github.com/CIAT/nbs_ruralscan.git "$work/producer.git"
          python3 -m venv "$work/venv"
          "$work/venv/bin/pip" install --quiet 'markdown==3.11.3' 'duckdb==1.5.3' 'pandas==2.3.1'

          export RURALSCAN_PEOPLE="$work/people.txt" RURALSCAN_EVIDENCE="$work/evidence"
          export RURALSCAN_RUNTIME="$work/runtime" RURALSCAN_CIAT="$work/producer.git"
          "$work/venv/bin/python" -B build/fetch_package.py
          # A failed attribution check can report excerpts of private notes.
          if ! "$work/venv/bin/python" -B build/build.py --out "$stage/reference" > "$work/checks.log" 2>&1; then
            echo "::warning title=Reference not published::Reference build or validation failed."
            exit 1
          fi
          test -s "$stage/reference/index.html"
          test ! -e "$stage/reference/NOT-FOR-PUBLICATION.txt"
          # A later source pin must also opt in before its pages can be listed.
          python3 - "$stage/reference" <<'PYTHON'
          from pathlib import Path
          import sys
          for page in Path(sys.argv[1]).rglob("*.html"):
              if '<meta name="robots" content="noindex">' in page.read_text(encoding="utf-8"):
                  raise SystemExit("Reference output is marked noindex")
          PYTHON
          test ! -e "$GITHUB_WORKSPACE/site/reference"
          mv "$stage/reference" "$GITHUB_WORKSPACE/site/reference"
      - name: Require the consolidated evidence methods
        run: |
          test -s site/reference/ch-evidence-principles.html
          test -s site/reference/ch-compiling-evidence.html
          test -s site/reference/ch-suitability-synthesis.html
          test -s site/reference/ch-t4-legacy-compiler.html
          test -s site/reference/ch-evidence-registry.html
          test -s site/reference/ch-combining-t4-evidence.html
      - name: Build and verify pinned methodology editions
        run: python3 publish_editions.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deploy
