name: Methodology reference
# Checks the reference builds from a clean machine and reports pins that have fallen behind.
# Publishes nothing: the built pages are discarded when the job ends.
on:
  pull_request:
    branches: [main]
    paths:
      - 'methodology-reference/**'
      - '.github/workflows/methodology-reference.yml'
  push:
    branches: [main]
    paths:
      - 'methodology-reference/**'
      - '.github/workflows/methodology-reference.yml'
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: read
concurrency:
  group: methodology-reference-${{ github.ref }}
  cancel-in-progress: true
jobs:
  moved:
    name: Report moved pins and closed plans
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Compare each pin with its current head (reports, never fails)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 methodology-reference/build/staleness.py
  build:
    name: Build and run the checks
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read the pinned revisions from the build
        id: pins
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import re
          text = open("methodology-reference/build/core.py").read()
          for key, name in (("evidence", "EVIDENCE_OPERATING"), ("site", "SITE_REV")):
              print(f"{key}=" + re.search(rf'^{name} = "([0-9a-f]{{40}})"', text, re.M).group(1))
          PY
      - name: Fetch the published site at its pinned revision
        env:
          SITE_REV: ${{ steps.pins.outputs.site }}
        run: git fetch --no-tags origin "$SITE_REV"
      - name: Check out the evidence repository at the operating revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: RuralScan/evidence
          ref: ${{ steps.pins.outputs.evidence }}
          path: _deps/evidence
          persist-credentials: false
      - name: Check out the runtime repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: RuralScan/runtime
          path: _deps/runtime
          persist-credentials: false
      - name: Fetch the producer history the pinned edition is read from
        run: |
          git clone --bare --single-branch --branch main --no-tags \
            https://github.com/CIAT/nbs_ruralscan.git "$RUNNER_TEMP/producer.git"
      - name: Point the build at the three checkouts
        run: |
          {
            echo "RURALSCAN_EVIDENCE=$GITHUB_WORKSPACE/_deps/evidence"
            echo "RURALSCAN_RUNTIME=$GITHUB_WORKSPACE/_deps/runtime"
            echo "RURALSCAN_CIAT=$RUNNER_TEMP/producer.git"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install 'markdown==3.11.3' 'duckdb==1.5.3' 'pandas==2.3.1'
      - name: Supply the names list when the secret is set
        env:
          NAMES: ${{ secrets.REFERENCE_PEOPLE }}
        run: |
          if [ -n "$NAMES" ]; then
            printf '%s\n' "$NAMES" > "$RUNNER_TEMP/people.txt"
            echo "RURALSCAN_PEOPLE=$RUNNER_TEMP/people.txt" >> "$GITHUB_ENV"
          else
            echo "RURALSCAN_PEOPLE_OPTIONAL=1" >> "$GITHUB_ENV"
            echo "::notice title=Names list not supplied::The personal-attribution check is reported as not run. Set the REFERENCE_PEOPLE secret to run it."
          fi
      - name: Download and verify the published data package
        working-directory: methodology-reference
        run: python build/fetch_package.py
      - name: Build the reference and run its checks
        working-directory: methodology-reference
        run: python -B build/build.py --out "$RUNNER_TEMP/reference-site"
