name: One-time erosion raster inspection
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/erosion-inspection-once.yml', '.github/erosion_inspection_once.py']
permissions:
  contents: read
jobs:
  inspect:
    if: github.event.pull_request.head.repo.full_name == 'RuralScan/method' && github.event.pull_request.head.ref == 'codex/bii-context-erosion-binding'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare ephemeral runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h .
          sudo apt-get update -qq
          sudo apt-get install -y libarchive-tools
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python3 -m pip install rasterio numpy
      - name: Download and verify publisher archive
        env:
          AUDIT_ROOT: ${{ runner.temp }}/erosion-audit
        run: |
          mkdir -p "$AUDIT_ROOT"
          curl --fail --location --retry 4 --output "$AUDIT_ROOT/glosem_2019.rar" https://ndownloader.figshare.com/files/34079996
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['AUDIT_ROOT']);p=root/'glosem_2019.rar'
          assert p.stat().st_size==16574457781
          md5=hashlib.md5();sha=hashlib.sha256()
          with p.open('rb') as f:
              for b in iter(lambda:f.read(16*1024*1024),b''):md5.update(b);sha.update(b)
          assert md5.hexdigest()=='ba910ecf8fe95fc60a054c5cc42671d2'
          result={'url':'https://ndownloader.figshare.com/files/34079996','bytes':p.stat().st_size,'md5':md5.hexdigest(),'sha256':sha.hexdigest(),'producer_md5_verified':True,'execution':'GitHub Actions','run_id':os.environ['GITHUB_RUN_ID'],'revision':os.environ['GITHUB_SHA']}
          (root/'download_verification.json').write_text(json.dumps(result,indent=2)+'\n');print(result)
          PY
      - name: Extract selected baseline raster and inspect native values
        env:
          EROSION_AUDIT_ROOT: ${{ runner.temp }}/erosion-audit
          EROSION_METHOD_ROOT: ${{ github.workspace }}
        run: |
          bsdtar -tvf "$EROSION_AUDIT_ROOT/glosem_2019.rar" > "$EROSION_AUDIT_ROOT/archive_listing.txt"
          mkdir -p "$EROSION_AUDIT_ROOT/extracted"
          bsdtar -xvf "$EROSION_AUDIT_ROOT/glosem_2019.rar" -C "$EROSION_AUDIT_ROOT/extracted" Data2_SOIL_DISPLACEMENT_ESTIMATE_2019/SOIL_DISPLACEMENT_ESTIMATE_2019.tif
          python3 -m pip freeze > "$EROSION_AUDIT_ROOT/library_versions.txt"
          python3 .github/erosion_inspection_once.py | tee "$EROSION_AUDIT_ROOT/inspection.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: erosion-native-inspection
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/erosion-audit/*.json
            ${{ runner.temp }}/erosion-audit/*.txt
            ${{ runner.temp }}/erosion-audit/*.log
            ${{ runner.temp }}/erosion-audit/*.npy
            ${{ runner.temp }}/erosion-audit/*.tif
