name: Priority classification catalogue
on:
  pull_request:
    branches: [main]
    paths: ['priority/**', 'data-model/configuration/**', 'data-model/priority-contract.json', '.github/workflows/priority-catalogue.yml']
  push:
    branches: [main]
    paths: ['priority/**', 'data-model/configuration/**', 'data-model/priority-contract.json', '.github/workflows/priority-catalogue.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read source packet revision
        id: pin
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          print('revision=' + json.load(open('priority/evidence.lock.json'))['revision'])
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: RuralScan/evidence
          ref: ${{ steps.pin.outputs.revision }}
          path: _priority-evidence
          persist-credentials: false
      - name: Check catalogue, source packets and immutable versions
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 priority/catalogue.py check --evidence-repo _priority-evidence --base "$BASE_SHA"
          python3 -m unittest discover -v -s priority
