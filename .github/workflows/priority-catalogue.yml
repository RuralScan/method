name: Priority classification catalogue
on:
  pull_request:
    branches: [main]
    paths: ['decisions/**', 'priority/**', 'data-model/configuration/**', 'data-model/priority-contract.json', '.github/workflows/priority-catalogue.yml']
  push:
    branches: [main]
    paths: ['decisions/**', 'priority/**', 'data-model/configuration/**', 'data-model/priority-contract.json', '.github/workflows/priority-catalogue.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install source-replay dependency
        run: python3 -m pip install 'pymupdf==1.27.2.3' 'jsonschema==4.25.1'
      - name: Read source packet revision
        id: pin
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          print('revision=' + json.load(open('priority/evidence.lock.json'))['revision'])
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: RuralScan/evidence
          ref: ${{ steps.pin.outputs.revision }}
          path: _priority-evidence
          persist-credentials: false
      - name: Check catalogue, source packets and immutable versions
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 - <<'PYLOCK' > "$RUNNER_TEMP/priority-source-revisions"
          import json, pathlib, re
          locks = [pathlib.Path('priority/t5-evidence.lock.json'), pathlib.Path('priority/bindings/evidence.lock.json'), *pathlib.Path('priority/source-locks').glob('*.json')]
          for revision in sorted({json.loads(path.read_text())['revision'] for path in locks}):
              assert re.fullmatch('[0-9a-f]{40}', revision)
              print(revision)
          PYLOCK
          while IFS= read -r revision; do git -C _priority-evidence fetch --depth=1 origin "$revision"; done < "$RUNNER_TEMP/priority-source-revisions"
          python3 priority/catalogue.py check --evidence-repo _priority-evidence --base "$BASE_SHA"
          python3 priority/t5_refs.py
          python3 priority/context_rules.py check
          python3 priority/binding_candidates.py check --evidence-repo _priority-evidence
          python3 priority/t5_review.py --evidence-repo _priority-evidence
          python3 -m unittest discover -v -s priority
      - name: Verify carbon and Naturebase research audit records
        run: python3 priority/research/verify_research.py
      - name: Verify Haiti water and food research audit records
        run: python3 priority/research/verify_haiti_bindings.py
      - name: Check accepted package history against current evidence main
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git clone --single-branch --branch main --no-tags https://github.com/RuralScan/evidence.git "$RUNNER_TEMP/priority-evidence-main"
          EVIDENCE_BASE=$(git -C "$RUNNER_TEMP/priority-evidence-main" rev-parse HEAD)
          python3 priority/package.py check-history --method-base "$BASE_SHA" --evidence-repo "$RUNNER_TEMP/priority-evidence-main" --evidence-base "$EVIDENCE_BASE"
