name: T2 variable registry
on:
  pull_request:
    branches: [main]
    paths:
      - 'priority/t2/**'
      - 'data-model/priority-contract.json'
      - 'data-model/configuration/T1_data_registry.csv'
      - 'data-model/configuration/T2_climate_risk.csv'
      - '.github/workflows/t2-registry.yml'
  push:
    branches: [main]
    paths:
      - 'priority/t2/**'
      - 'data-model/priority-contract.json'
      - 'data-model/configuration/T1_data_registry.csv'
      - 'data-model/configuration/T2_climate_risk.csv'
      - '.github/workflows/t2-registry.yml'
permissions:
  contents: read
jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -v -s priority/t2 -p 'test_*.py'
      - run: python3 priority/t2/registry.py check
